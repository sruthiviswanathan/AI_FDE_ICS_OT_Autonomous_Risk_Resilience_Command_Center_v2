# Decision trace (ENH-10)

type: object
required: [decision_id, policy, recommendation, executed, hidden_cot_as_authority]
properties:
  decision_id: {type: string}
  persisted_at: {type: string}
  policy:
    type: object
  recommendation: {type: string}
  tokens: {type: number}
  latency_ms: {type: number}
  executed: {type: boolean}
  hidden_cot_as_authority: {type: boolean}
  execute_control: {type: boolean}
  model_version: {type: string}
  prompt_id: {type: string}
description: Append-only JSONL at data/local/decision_traces.jsonl (gitignored). Not policy.
