# Local workshop CI (synthetic repo). No real OT connectors.
name: workshop
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pins
        run: python -m pip install -r requirements.txt
      - name: verify_repo
        run: python scripts/verify_repo.py
      - name: sdd-gates
        run: python scripts/check_sdd_gates.py
      - name: pytest
        run: python -m pytest -q
